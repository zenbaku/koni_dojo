# The engine's own CI gate — mirrors `task check` (format + analyze + test), which
# needs only the Dart SDK (no Flutter, no app checkout, no workspace). Runs
# on every push/PR so a break is caught automatically instead of only when
# someone remembers to run `task check` locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned to match local dev (the Dart bundled with Flutter 3.44.6),
          # and pinned *because* of the format gate below. `dart format`'s
          # output changes between SDK releases, so a floating `stable` turns
          # every Dart release into a red build on a repo nobody touched —
          # which is exactly what happened the first time this gate ran.
          # Bump deliberately, with the local toolchain, re-running the
          # formatter in the same commit.
          sdk: '3.12.2'
      - run: dart pub get
      # Repo-wide, so the Flutter sub-packages are gated here too rather than
      # each needing its own step: `dart format` needs no Flutter SDK, and
      # unformatted files are how an unrelated edit turns into a few hundred
      # lines of reflow nobody meant to review.
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: dart test

  webview-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Same pin as the Dart job above, and the same reason: an unpinned
          # `stable` moves under a repo nobody touched. Flutter 3.44.6 bundles
          # Dart 3.12.2, so all three jobs and local dev run one toolchain.
          # Bump the three together.
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: flutter pub get (webview/)
        working-directory: webview
        run: flutter pub get
      - name: flutter analyze (webview/)
        working-directory: webview
        run: flutter analyze
      - name: flutter test (webview/)
        working-directory: webview
        run: flutter test

  playground-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Same pin as the Dart job above, and the same reason: an unpinned
          # `stable` moves under a repo nobody touched. Flutter 3.44.6 bundles
          # Dart 3.12.2, so all three jobs and local dev run one toolchain.
          # Bump the three together.
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: flutter pub get (playground/)
        working-directory: playground
        run: flutter pub get
      - name: flutter analyze (playground/)
        working-directory: playground
        run: flutter analyze
      - name: flutter test (playground/)
        working-directory: playground
        run: flutter test
